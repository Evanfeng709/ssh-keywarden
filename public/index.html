<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SSH Keywarden</title>
<script>
  /* 首帧前定好主题，避免深色用户看到白闪；结论与 js/theme.js 一致 */
  (function () {
    var auto = { 'auto': ['obsidian', 'cloud'], 'auto-soft': ['graphite', 'linen'] };
    var known = ['obsidian', 'midnight', 'graphite', 'cloud', 'linen', 'mist'];
    var choice = 'obsidian';
    try { choice = localStorage.getItem('kw.theme') || 'obsidian'; } catch (e) {}
    /* 桌面版每次启动端口都变，localStorage 是空的，主题以主进程记的为准 */
    try { if (window.keywarden && window.keywarden.theme && window.keywarden.theme.initial) choice = window.keywarden.theme.initial; } catch (e) {}
    var dark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)').matches : true;
    var id = auto[choice] ? auto[choice][dark ? 0 : 1] : (known.indexOf(choice) >= 0 ? choice : 'obsidian');
    document.documentElement.dataset.theme = id;
  })();
</script>
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8.5" r="4.5"/><path d="M11.7 11.7 20 20"/><path d="M17 17l2-2"/><path d="M19 19l2-2"/></svg>
    </span>
    <span class="title">SSH Keywarden</span>
    <span class="ver" id="version">v—</span>
  </div>

  <div class="top-right">
    <div class="mode-switch" id="modeSwitch" role="group" aria-label="视图模式">
      <button type="button" data-mode="keys" class="on" title="管理服务器密钥">密钥</button>
      <button type="button" data-mode="term" title="只开 SSH 终端，不读取服务器密钥">纯终端</button>
    </div>

    <select id="hostSelect" title="选择主机"></select>

    <button id="btnLocal" class="square-btn" title="显示本地密钥库" aria-label="本地密钥库" aria-pressed="false" aria-controls="localPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>

    <div class="action-group" role="group" aria-label="主操作">
      <button id="btnConnect" class="tool-btn primary" title="连接所选主机">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7V3M15 7V3"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></svg>
        <span class="lbl">连接</span>
      </button>
      <button id="btnTerm" class="tool-btn dim" title="先连接服务器才能开终端">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/></svg>
        <span class="lbl">终端</span>
      </button>
      <button id="btnHosts" class="tool-btn" title="管理主机">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6.5" rx="2"/><rect x="3" y="13.5" width="18" height="6.5" rx="2"/><path d="M7 7.25h.01M7 16.75h.01"/></svg>
        <span class="lbl">管理主机</span>
      </button>
      <button id="btnSettings" class="tool-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h8M16 7h4M4 12h3M11 12h9M4 17h10M18 17h2"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>
        <span class="lbl">设置</span>
      </button>
    </div>

    <div class="win-controls" id="winControls">
      <button id="winMin" class="win-btn" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 5h6"/></svg>
      </button>
      <button id="winMax" class="win-btn" title="最大化" aria-label="最大化">
        <svg class="ico-max" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="2.5" y="2.5" width="5" height="5"/></svg>
        <svg class="ico-restore" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3.5" width="4.8" height="4.8"/><path d="M3.7 3.5V2h4.8v4.8H7"/></svg>
      </button>
      <button id="winClose" class="win-btn close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M2 2l6 6M8 2 2 8"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="layout" id="layout">
  <section class="panel server-panel">
    <div class="panel-head">
      <div class="head-left">
        <h2>服务器密钥</h2>
        <div class="meta meta-server" id="serverMeta">未连接</div>
        <!-- 信息条由 renderServerMeta() 动态渲染：主机（带复制按钮）/ 路径（可复制）/ 系统名 -->
      </div>
      <div class="head-right">
        <div class="act-group">
          <button id="btnRefresh" class="act-btn" disabled title="重新读取服务器密钥">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.34-5.66"/><path d="M20 4v7h-7"/></svg>
            <span class="lbl">刷新</span>
          </button>
          <button id="btnBackups" class="act-btn" disabled title="查看并恢复历史备份">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            <span class="lbl">备份</span>
          </button>
        </div>
        <span class="act-sep" aria-hidden="true"></span>
        <div class="act-group">
          <button id="btnAdd" class="act-btn is-primary" disabled title="新增公钥到服务器">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="lbl">新增密钥</span>
          </button>
          <button id="btnDelete" class="act-btn" disabled title="删除选中的密钥">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7 7.5 20h9l1-13"/><path d="M10.5 11v5M13.5 11v5"/></svg>
            <span class="lbl">删除</span><span id="selCount" class="pill hidden">0</span>
          </button>
        </div>
        <span class="act-sep" aria-hidden="true"></span>
        <div class="act-group">
          <button id="btnDisconnect" class="act-btn" disabled title="断开当前连接">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"/><path d="M7.2 6.2a8 8 0 1 0 9.6 0"/></svg>
            <span class="lbl">断开</span>
          </button>
        </div>
      </div>
    </div>

    <div id="notice" class="notice hidden"></div>

    <div id="keyTools" class="key-tools hidden">
      <div class="key-search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="keySearch" type="text" placeholder="搜索注释 / 指纹 / 本地文件 / 备注" autocomplete="off" spellcheck="false" />
        <button id="keySearchClear" class="key-search-clear hidden" title="清空搜索">×</button>
      </div>
      <div id="keyFilter" class="key-filter" role="group" aria-label="筛选服务器密钥">
        <button type="button" data-filter="all" class="on">全部 <b>0</b></button>
        <button type="button" data-filter="unmatched">本地无匹配 <b>0</b></button>
        <button type="button" data-filter="dup">重复 <b>0</b></button>
        <button type="button" data-filter="used">本次在用 <b>0</b></button>
      </div>
      <span id="keyViewCount" class="key-view-count"></span>
      <span id="keySelHidden" class="key-sel-hidden hidden"></span>
    </div>

    <div class="table-wrap">
      <table class="key-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="checkAll" title="全选" /></th>
            <th class="col-type">类型</th>
            <th class="col-fp">指纹 (SHA256)</th>
            <th class="col-status">状态</th>
            <th class="col-comment">注释 / 来源</th>
            <th class="col-local">本地匹配</th>
            <th class="col-op">操作</th>
          </tr>
        </thead>
        <tbody id="keyBody"></tbody>
      </table>
      <div class="empty" id="emptyState">
        <div class="empty-icon">🗝️</div>
        <p>还没有连接服务器</p>
        <p class="hint">先在右上角选一台主机（没有就点「管理主机」新建）。<br />连接后这里会列出服务器允许登录的所有钥匙。</p>
      </div>
    </div>

    <div id="termEmpty" class="empty term-empty">
      <p>还没有连接服务器</p>
      <p class="hint">纯终端模式只建立 SSH 会话并打开终端，不读取也不管理 authorized_keys。<br />选一台主机后点右上角「连接」。</p>
    </div>

    <div id="termSplitter" class="term-splitter hidden" title="拖动调整高度，双击恢复自适应"></div>

    <div id="termPanel" class="term-panel hidden">
      <div class="term-head">
        <span class="term-title"><i id="termDot" class="term-dot" title="未连接"></i>终端</span>
        <span class="term-status hidden" id="termStatus"></span>
        <span style="flex:1"></span>
        <button id="termCopy" class="link-btn" title="复制选中内容（Ctrl+Shift+C）">复制</button>
        <button id="termPaste" class="link-btn" title="粘贴剪贴板内容（Ctrl+V）">粘贴</button>
        <button id="termClear" class="link-btn">清屏</button>
        <button id="termClose" class="icon-btn" title="收起终端（会话保留）">✕</button>
      </div>
      <div id="termBody" class="term-body"></div>
    </div>
  </section>

  <aside class="panel local-panel" id="localPanel">
    <div class="local-head">
      <div class="local-title-row">
        <h2>本地密钥库</h2>
        <span id="localCount" class="local-count">0</span>
        <button id="btnRescan" class="icon-btn" title="重新扫描">⟳</button>
      </div>
      <button id="localDirBtn" class="local-dir" title="未设置密钥目录" disabled>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="localDir" class="local-dir-text">—</span>
        <svg class="local-dir-copy" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>

    <div id="localTools" class="local-tools hidden">
      <div class="local-search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="localSearch" type="text" placeholder="搜索名称 / 指纹 / 目录" autocomplete="off" spellcheck="false" />
        <button id="localSearchClear" class="local-search-clear hidden" title="清空搜索">×</button>
      </div>
      <div id="localFilter" class="local-filter" role="group" aria-label="按密钥类型筛选">
        <button data-kind="all" class="on">全部 <b>0</b></button>
        <button data-kind="private">私钥 <b>0</b></button>
        <button data-kind="public">公钥 <b>0</b></button>
      </div>
    </div>

    <ul id="localList" class="local-list"></ul>
    <div class="local-errors" id="localErrors"></div>
  </aside>
</main>

<footer class="logbar">
  <div class="log-head">
    <span>操作日志</span>
    <button id="btnClearLog" class="link-btn">清空</button>
  </div>
  <div id="log" class="log-body"></div>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
