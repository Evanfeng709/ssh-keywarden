[package]
name = "kw-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SSH Keywarden 手机端（Flutter）调用的 Rust 门面"

[lib]
# cdylib 给 Android/iOS 动态库，staticlib 给 iOS 静态链接，rlib 给 Rust 测试
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kw-keys = { path = "../kw-keys" }
kw-store = { path = "../kw-store" }
kw-ssh = { path = "../kw-ssh" }
kw-server = { path = "../kw-server" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
rand.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
