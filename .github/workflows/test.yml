name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 下界跟 package.json 的 engines 对齐：electron 45 的依赖链
        # （electron / @electron/get / @electron/rebuild）都要求 node >=22.12.0，
        # 在 node 20 上只会出 EBADENGINE 警告，测它没有意义。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
