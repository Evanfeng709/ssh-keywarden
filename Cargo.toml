[workspace]
resolver = "2"
members = [
    "crates/kw-core",
    "crates/kw-keys",
    "crates/kw-store",
    "crates/kw-ssh",
    "crates/kw-server",
    "crates/kw-desktop",
    "crates/kw-ffi",
    "crates/kw-sync",
]

[workspace.package]
version = "2026.11.3-5"
edition = "2021"
license = "MIT"
authors = ["Evanfeng709"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# 0.6 是当前稳定线；0.7 还在 rc。密钥类型合并进 ssh-key 自身，不再需要 russh-keys。
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption", "rand_core"] }
# ssh-key 自己不生成 RSA 密钥，生成必须借 rsa crate（并且要能读旧版写下的 PKCS#1 PEM）
rsa = { version = "0.9.10", features = ["pem"] }
rand = "0.8"
zeroize = { version = "1.9", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# 加密后端固定用 ring，不用 russh 默认的 aws-lc-rs ——
# aws-lc 交叉编译到 Android 时要现场跑 CMake（还需要 perl/go），本机没有会直接卡死；
# ring 只需要 NDK 自带的 clang 汇编，Windows 端用 MSVC 的 ml64 也能过。
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
